    app.appendChild(section('Users not loaded', 'These sign in through their group and are created by VCFA at first login', D.notLoaded.length,
      table([{ label: 'User', name: 1 }, { label: 'Why not' }], D.notLoaded.map(function (u) { return [u.name, u.reason]; }), true), false));
    app.appendChild(section('Already in VCFA', 'Skipped because they exist (missing roles are still added)', D.skipped.length,
      table([{ label: 'Type' }, { label: 'Name', name: 1 }, { label: 'Reason' }], D.skipped.map(function (s) { return [s.type, s.name, s.reason]; }), true), false));
    foot.appendChild(el('div', null, 'VCFA had ' + D.vcfa.roles + ' roles, ' + D.vcfa.users + ' users and ' + D.vcfa.groups + ' groups before this run. Users in this run: ' + MODE[D.userMode] + '.'));
  }

  if (!DATA) { app.appendChild(el('p', null, 'No report data was embedded in this file.')); return; }
  document.title = (DATA.kind === 'export' ? 'vRA export report' : 'VCFA load report') + ' — ' + (DATA.org || '');
  (DATA.kind === 'export' ? renderExport : renderLoad)(DATA);
  foot.appendChild(el('div', null, 'This report contains user and group names from your environment. Do not share it outside the engagement.'));
})();
</script>
</body>
</html>
